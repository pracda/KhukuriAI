# Local OTel Collector configuration.
#
# Forwards everything it receives to the Ingest service, authenticated with a
# per-tenant ingest key. Set KHUKURI_INGEST_KEY in .env to a key issued by
# Identity (POST /api/v1/tenants/<slug>/keys with type INGEST).
#
# encoding: json is required — the ingest service accepts OTLP/JSON and rejects
# protobuf with 415. See services/ingest/README.md.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  memory_limiter:
    check_interval: 2s
    limit_mib: 256
    spike_limit_mib: 64

exporters:
  otlphttp/khukuri:
    endpoint: ${env:KHUKURI_INGEST_ENDPOINT}
    encoding: json
    headers:
      X-Khukuri-Ingest-Key: ${env:KHUKURI_INGEST_KEY}
  debug:
    verbosity: basic

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/khukuri]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/khukuri]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/khukuri]

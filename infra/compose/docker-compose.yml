name: khukuri

# Data plane for local development and demos.
# Application services join this file as they are built (Phase 1+).
# Host ports are deliberately offset from defaults to avoid collisions
# with other local stacks — see README.md for the port map.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: khukuri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: khukuri
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khukuri"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: khukuri
      CLICKHOUSE_USER: khukuri
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8143:8123"   # HTTP
      - "9010:9000"   # native
    volumes:
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 48
    ports:
      - "19092:19092"
    volumes:
      - kafkadata:/var/lib/kafka/data

  identity:
    build: ../../services/identity
    profiles: ["apps"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/khukuri
      SPRING_DATASOURCE_USERNAME: khukuri
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      IDENTITY_ADMIN_PASSWORD: ${IDENTITY_ADMIN_PASSWORD:?set in .env}
      IDENTITY_CLIENT_GATEWAY_SECRET: ${IDENTITY_CLIENT_GATEWAY_SECRET:?set in .env}
      IDENTITY_ISSUER: http://localhost:8181
    ports:
      - "8181:8181"
    depends_on:
      postgres:
        condition: service_healthy

  ingest:
    build: ../../services/ingest
    profiles: ["apps"]
    environment:
      CLICKHOUSE_URL: jdbc:ch://clickhouse:8123/khukuri
      CLICKHOUSE_USER: khukuri
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
      KAFKA_BOOTSTRAP: kafka:9092
      IDENTITY_URL: http://identity:8181
      IDENTITY_CLIENT_SECRET: ${IDENTITY_CLIENT_GATEWAY_SECRET:?set in .env}
    ports:
      - "8182:8182"
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_started
      identity:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - kafka

volumes:
  pgdata:
  chdata:
  kafkadata:

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate repo structure & configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        working-directory: infra/compose
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Validate event schemas are valid JSON Schema
        run: |
          pip install --quiet check-jsonschema
          for f in contracts/events/*.schema.json; do
            check-jsonschema --check-metaschema "$f"
          done

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

  gateway:
    name: Gateway — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and test
        run: mvn --batch-mode verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-test-reports
          path: gateway/target/surefire-reports

  identity:
    name: Identity — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: mvn --batch-mode verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: identity-test-reports
          path: services/identity/target/surefire-reports

  ingest:
    name: Ingest — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: mvn --batch-mode verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-test-reports
          path: services/ingest/target/surefire-reports

  incident:
    name: Incident — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/incident
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: mvn --batch-mode verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: incident-test-reports
          path: services/incident/target/surefire-reports

  agent-runtime:
    name: Agent runtime — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai/agent-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  # Further jobs join per module as code lands:
  #   services/scanhub (Maven)
